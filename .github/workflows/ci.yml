name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Rust Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Rust format check
        run: cargo fmt --check
      - name: Rust clippy
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Rust tests (includes the no-network-crate guard)
        run: cargo test --workspace --locked
      # The EmbarkStudios action is container-based and runs on Linux only; this job runs on macOS.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check
      - name: Install Node for Tauri build
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.4
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Approve build scripts
        run: pnpm approve-builds --all
      - name: Build Flint.app bundle (M10.04)
        run: pnpm exec tauri build --bundles app

  frontend:
    name: Frontend Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Approve build scripts
        run: pnpm approve-builds --all
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Vitest tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build
