# cargo-deny policy (M10.3). Flint makes no outbound network requests (CLAUDE.md invariant 5).
[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# Unmaintained notices for transitive crates (bincode via syntect, unic-* via tauri) are not
# actionable here; vulnerabilities still fail the check.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD",
    "BSL-1.0", "CDLA-Permissive-2.0", "OpenSSL", "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Outbound HTTP clients are banned everywhere except as a transitive dependency of `tauri`, which
# declares reqwest on some targets but is never used to make a request (updater is off).
deny = [
    { crate = "reqwest", wrappers = ["tauri"] },
    { name = "ureq" },
    { name = "isahc" },
    { name = "curl" },
    { name = "surf" },
    { name = "attohttpc" },
    { name = "tauri-plugin-updater" },
    { name = "tauri-plugin-http" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
