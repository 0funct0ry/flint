name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/commands/appCommands.ts'
      - '.github/workflows/docs.yml'
  # Deployment to GitHub Pages is manual-only: run this workflow from the Actions tab
  # (or `gh workflow run docs.yml`) when you actually want to publish. Pushes to main and
  # tag pushes never trigger a deploy on their own.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11.0.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm approve-builds --all

      - name: Build docs site
        run: pnpm --filter flint-docs build

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
