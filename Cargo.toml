[workspace]
resolver = "2"
members = [
    "crates/flint-core",
    "crates/flint-cli",
    "crates/flint-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Flint Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/0funct0ry/flint"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
trash = "5.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
ammonia = "4.0"
syntect = { version = "5.2", default-features = false, features = ["default-themes", "default-syntaxes", "html", "regex-fancy"] }
notify = "8.0"
ignore = "0.4"
rayon = "1.10"
regex = "1.10"
globset = "0.4"
